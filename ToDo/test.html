<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do - Test</title>
  <style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #f7f7f8;
  --surface: #fff;
  --text: #222;
  --muted: #666;
  --border: #eee;
  --input-border: #ccc;
  --accent: #2b6cb0;
  --accent-hover: #235a92;
  --shadow: rgba(0, 0, 0, 0.1);
}

[data-theme="dark"] {
  --bg: #17181c;
  --surface: #23252b;
  --text: #eee;
  --muted: #999;
  --border: #333;
  --input-border: #444;
  --accent: #4a8fd6;
  --accent-hover: #5a9fe6;
  --shadow: rgba(0, 0, 0, 0.4);
}

body {
  margin: 0;
  padding: 1.5rem;
  font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: background-color 0.2s, color 0.2s;
}

main {
  max-width: 480px;
  margin: 0 auto;
  background: var(--surface);
  border-radius: 8px;
  padding: 1.5rem;
  box-shadow: 0 1px 3px var(--shadow);
}

.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1rem;
}

h1 {
  margin: 0;
  font-size: 1.5rem;
}

#theme-toggle {
  border: 1px solid var(--input-border);
  background: transparent;
  color: var(--text);
  border-radius: 4px;
  padding: 0.3rem 0.6rem;
  cursor: pointer;
  font-size: 1rem;
  height: fit-content;
  transition: background-color 0.2s;
}

#theme-toggle:hover {
  background: var(--border);
}

#add-form {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}

#task-input, #due-date-input, #priority-input {
  padding: 0.5rem;
  font-size: 1rem;
  border: 1px solid var(--input-border);
  border-radius: 4px;
  background: var(--surface);
  color: var(--text);
}

#task-input {
  flex: 1;
  min-width: 150px;
}

#due-date-input {
  flex: 0 1 150px;
}

#priority-input {
  flex: 0 1 auto;
}

#add-form button[type="submit"] {
  padding: 0.5rem 1rem;
  font-size: 1rem;
  border: none;
  border-radius: 4px;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  font-weight: 600;
  transition: background-color 0.2s;
}

#add-form button[type="submit"]:hover {
  background: var(--accent-hover);
}

#search-input {
  flex: 1;
  padding: 0.5rem;
  font-size: 1rem;
  border: 1px solid var(--input-border);
  border-radius: 4px;
  background: var(--surface);
  color: var(--text);
  margin-bottom: 0.75rem;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes slideOut {
  from {
    opacity: 1;
    transform: translateX(0);
  }
  to {
    opacity: 0;
    transform: translateX(100%);
  }
}

@keyframes checkPulse {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.2);
  }
}

.filter-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 0.75rem;
  gap: 0.5rem;
  flex-wrap: wrap;
}

#filters {
  display: flex;
  gap: 0.25rem;
}

.filter-btn {
  border: 1px solid var(--input-border);
  background: transparent;
  color: var(--text);
  border-radius: 4px;
  padding: 0.25rem 0.6rem;
  font-size: 0.8rem;
  cursor: pointer;
  transition: background-color 0.2s, border-color 0.2s;
}

.filter-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

#clear-completed {
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 0.8rem;
  cursor: pointer;
  text-decoration: underline;
  transition: color 0.2s;
}

#clear-completed:hover {
  color: var(--text);
}

#task-list {
  list-style: none;
  margin: 0;
  padding: 0;
}

#task-list li {
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
  padding: 0.75rem 0;
  border-bottom: 1px solid var(--border);
  animation: fadeIn 0.3s ease-out;
}

#task-list li.removing {
  animation: slideOut 0.3s ease-out forwards;
}

#task-list li:last-child {
  border-bottom: none;
}

#task-list li input[type="checkbox"] {
  margin-top: 0.2rem;
  cursor: pointer;
  transition: transform 0.2s ease;
  flex-shrink: 0;
}

#task-list li input[type="checkbox"]:checked {
  animation: checkPulse 0.4s ease;
}

#task-list li.done span.text {
  text-decoration: line-through;
  color: var(--muted);
}

#task-list li .task-info {
  display: flex;
  flex-direction: column;
  flex: 1;
  gap: 0.2rem;
}

#task-list li span.text {
  word-break: break-word;
  cursor: text;
}

#task-list li input.edit-input {
  flex: 1;
  padding: 0.2rem 0.4rem;
  font-size: 1rem;
  border: 1px solid var(--accent);
  border-radius: 4px;
  background: var(--surface);
  color: var(--text);
}

.priority-badge {
  font-size: 0.65rem;
  font-weight: 700;
  padding: 0.2rem 0.5rem;
  border-radius: 999px;
  text-transform: uppercase;
  color: #fff;
  white-space: nowrap;
  flex-shrink: 0;
  margin-top: 0.15rem;
}

.priority-high {
  background: #c53030;
}

.priority-medium {
  background: #b7791f;
}

.priority-low {
  background: #2f855a;
}

#task-list li button.delete {
  border: none;
  background: transparent;
  color: #c53030;
  font-size: 1.1rem;
  cursor: pointer;
  line-height: 1;
  padding: 0.2rem 0.4rem;
  transition: opacity 0.2s;
  flex-shrink: 0;
}

#task-list li button.delete:hover {
  opacity: 0.7;
}

.due-date {
  font-size: 0.75rem;
  color: var(--muted);
  font-weight: 500;
}

.due-date.overdue {
  color: #c53030;
  font-weight: 600;
}

.due-date.today {
  color: #b7791f;
  font-weight: 600;
}

.due-date.upcoming {
  color: #2f855a;
}

#count {
  margin: 1rem 0 0;
  font-size: 0.85rem;
  color: var(--muted);
}
  </style>
</head>
<body>
  <main>
    <div class="header-row">
      <h1>To Do</h1>
      <button type="button" id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
    </div>
    <form id="add-form">
      <input type="text" id="task-input" placeholder="What needs doing? (press / to focus)" autocomplete="off">
      <input type="date" id="due-date-input">
      <select id="priority-input">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <button type="submit">Add</button>
    </form>
    <input type="text" id="search-input" placeholder="Search tasks..." autocomplete="off">
    <div class="filter-row">
      <div id="filters">
        <button type="button" class="filter-btn active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="active">Active</button>
        <button type="button" class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <button type="button" id="clear-completed">Clear completed</button>
    </div>
    <ul id="task-list"></ul>
    <p id="count"></p>
  </main>

  <script>
const STORAGE_KEY = "todo-tasks";
const THEME_KEY = "todo-theme";
const MAX_TASK_LENGTH = 500;
const MAX_TASKS = 1000;
const VALID_PRIORITIES = ["low", "medium", "high"];

const form = document.getElementById("add-form");
const input = document.getElementById("task-input");
const dueDateInput = document.getElementById("due-date-input");
const priorityInput = document.getElementById("priority-input");
const list = document.getElementById("task-list");
const count = document.getElementById("count");
const themeToggle = document.getElementById("theme-toggle");
const filterButtons = document.querySelectorAll(".filter-btn");
const clearCompletedBtn = document.getElementById("clear-completed");
const searchInput = document.getElementById("search-input");

const PRIORITY_ORDER = { high: 0, medium: 1, low: 2 };

let tasks = loadTasks();
let filter = "all";
let searchQuery = "";

function generateId() {
  return `${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
}

function isValidTask(task) {
  return (
    task &&
    typeof task.id !== "undefined" &&
    typeof task.text === "string" &&
    task.text.length > 0 &&
    task.text.length <= MAX_TASK_LENGTH &&
    typeof task.done === "boolean" &&
    VALID_PRIORITIES.includes(task.priority) &&
    (task.dueDate === undefined || task.dueDate === null || typeof task.dueDate === "string")
  );
}

function loadTasks() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (!Array.isArray(data)) return [];
    return data.filter(isValidTask);
  } catch {
    return [];
  }
}

function saveTasks() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
}

function getDueDateStatus(dueDate) {
  if (!dueDate) return null;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const due = new Date(dueDate);
  due.setHours(0, 0, 0, 0);
  const diff = due - today;

  if (diff < 0) return "overdue";
  if (diff === 0) return "today";
  return "upcoming";
}

function getVisibleTasks() {
  const filtered = tasks.filter((t) => {
    const statusMatch = filter === "all" ? true : filter === "active" ? !t.done : t.done;
    const searchMatch = searchQuery === "" || t.text.toLowerCase().includes(searchQuery.toLowerCase());
    return statusMatch && searchMatch;
  });

  return filtered.slice().sort((a, b) => {
    const statusA = getDueDateStatus(a.dueDate);
    const statusB = getDueDateStatus(b.dueDate);

    const dueDateOrder = { overdue: 0, today: 1, upcoming: 2, null: 3 };
    const statusOrderA = dueDateOrder[statusA];
    const statusOrderB = dueDateOrder[statusB];

    if (statusOrderA !== statusOrderB) return statusOrderA - statusOrderB;

    if (statusA && statusB && a.dueDate && b.dueDate) {
      const dateA = new Date(a.dueDate);
      const dateB = new Date(b.dueDate);
      if (dateA - dateB !== 0) return dateA - dateB;
    }

    return PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority];
  });
}

function formatDueDate(dueDate) {
  if (!dueDate) return null;
  const date = new Date(dueDate);
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const due = new Date(date);
  due.setHours(0, 0, 0, 0);

  const diff = due - today;
  const daysFromNow = Math.ceil(diff / (1000 * 60 * 60 * 24));

  if (daysFromNow < 0) return `Overdue: ${date.toLocaleDateString()}`;
  if (daysFromNow === 0) return "Due today";
  if (daysFromNow === 1) return "Due tomorrow";
  return `Due: ${date.toLocaleDateString()}`;
}

function render() {
  list.innerHTML = "";
  getVisibleTasks().forEach((task) => {
    const li = document.createElement("li");
    li.className = task.done ? "done" : "";
    li.setAttribute("data-id", task.id);

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = task.done;
    checkbox.addEventListener("change", () => toggleTask(task.id));

    const badge = document.createElement("span");
    badge.className = `priority-badge priority-${task.priority}`;
    badge.textContent = task.priority;

    const taskInfo = document.createElement("div");
    taskInfo.className = "task-info";

    const text = document.createElement("span");
    text.className = "text";
    text.textContent = task.text;
    text.title = "Double-click to edit";
    text.addEventListener("dblclick", () => startEditing(task.id, li, text));

    taskInfo.appendChild(text);

    if (task.dueDate) {
      const dueSpan = document.createElement("span");
      dueSpan.className = "due-date";
      const status = getDueDateStatus(task.dueDate);
      if (status) dueSpan.classList.add(status);
      dueSpan.textContent = formatDueDate(task.dueDate);
      taskInfo.appendChild(dueSpan);
    }

    const deleteBtn = document.createElement("button");
    deleteBtn.className = "delete";
    deleteBtn.textContent = "✕";
    deleteBtn.addEventListener("click", () => deleteTask(task.id));

    li.append(checkbox, badge, taskInfo, deleteBtn);
    list.appendChild(li);
  });

  const remaining = tasks.filter((t) => !t.done).length;
  count.textContent = tasks.length
    ? `${remaining} of ${tasks.length} remaining`
    : "";
}

function startEditing(id, li, textEl) {
  const editInput = document.createElement("input");
  editInput.type = "text";
  editInput.className = "edit-input";
  editInput.value = textEl.textContent;

  li.replaceChild(editInput, textEl);
  editInput.focus();
  editInput.select();

  const finish = (save) => {
    if (save) {
      const value = editInput.value.trim();
      if (value) editTask(id, value);
      else render();
    } else {
      render();
    }
  };

  editInput.addEventListener("blur", () => finish(true));
  editInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") finish(true);
    if (e.key === "Escape") finish(false);
  });
}

function addTask(text, priority, dueDate) {
  text = text.trim();
  if (!VALID_PRIORITIES.includes(priority)) {
    console.error("Invalid priority:", priority);
    return;
  }
  if (!text || text.length > MAX_TASK_LENGTH) {
    alert(`Task must be 1-${MAX_TASK_LENGTH} characters`);
    return;
  }
  if (tasks.length >= MAX_TASKS) {
    alert(`Maximum ${MAX_TASKS} tasks allowed`);
    return;
  }
  tasks.push({ id: generateId(), text, done: false, priority, dueDate: dueDate || null });
  saveTasks();
  render();
}

function toggleTask(id) {
  const task = tasks.find((t) => t.id === id);
  if (task) task.done = !task.done;
  saveTasks();
  render();
}

function deleteTask(id) {
  const li = list.querySelector(`li[data-id="${id}"]`);
  if (li) {
    li.classList.add("removing");
    setTimeout(() => {
      tasks = tasks.filter((t) => t.id !== id);
      saveTasks();
      render();
    }, 300);
  } else {
    tasks = tasks.filter((t) => t.id !== id);
    saveTasks();
    render();
  }
}

function editTask(id, text) {
  text = text.trim();
  if (!text || text.length > MAX_TASK_LENGTH) {
    console.error("Invalid task text length");
    return;
  }
  const task = tasks.find((t) => t.id === id);
  if (task) {
    task.text = text;
    saveTasks();
    render();
  }
}

function clearCompleted() {
  tasks = tasks.filter((t) => !t.done);
  saveTasks();
  render();
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  const priority = priorityInput.value;
  const dueDate = dueDateInput.value;

  if (!text) return;
  if (text.length > MAX_TASK_LENGTH) {
    alert(`Task must be 1-${MAX_TASK_LENGTH} characters`);
    return;
  }
  if (!VALID_PRIORITIES.includes(priority)) {
    alert("Invalid priority selected");
    return;
  }

  addTask(text, priority, dueDate);
  input.value = "";
  dueDateInput.value = "";
  input.focus();
});

function applyTheme(theme) {
  if (theme === "dark") {
    document.documentElement.setAttribute("data-theme", "dark");
    themeToggle.textContent = "☀️";
  } else {
    document.documentElement.removeAttribute("data-theme");
    themeToggle.textContent = "🌙";
  }
}

function loadTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved) return saved;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
    ? "dark"
    : "light";
}

themeToggle.addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  const next = current === "dark" ? "light" : "dark";
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
});

filterButtons.forEach((btn) => {
  btn.addEventListener("click", () => {
    filter = btn.dataset.filter;
    filterButtons.forEach((b) => b.classList.toggle("active", b === btn));
    render();
  });
});

clearCompletedBtn.addEventListener("click", clearCompleted);

searchInput.addEventListener("input", (e) => {
  searchQuery = e.target.value;
  render();
});

document.addEventListener("keydown", (e) => {
  const tag = document.activeElement.tagName;
  const isTyping = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
  if (e.key === "/" && !isTyping) {
    e.preventDefault();
    input.focus();
  }
});

applyTheme(loadTheme());
render();
  </script>
</body>
</html>
